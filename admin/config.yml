backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - file: "content/site.json"
        label: "Site Settings"
        name: "site"
        format: "json"
        fields:
          - {label: "Site Name", name: "siteName", widget: "string"}
          - {label: "Primary Phone", name: "phonePrimary", widget: "string"}
          - {label: "Secondary Phone", name: "phoneSecondary", widget: "string", required: false}
          - {label: "Third Phone", name: "phoneTertiary", widget: "string", required: false}
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Logo", name: "logo", widget: "image"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}

  - name: "home"
    label: "Homepage"
    files:
      - file: "content/home.json"
        label: "Homepage Content"
        name: "home"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "text"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Button", name: "button", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Services Heading", name: "servicesHeading", widget: "string"}
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Icon", name: "icon", widget: "string", required: false}
          - label: "Value Cards"
            name: "values"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
          - label: "Why Choose"
            name: "whyChoose"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - label: "Tags"
                name: "tags"
                widget: "list"
                field: {label: "Tag", name: "tag", widget: "string"}
          - label: "Quote Section"
            name: "quote"
            widget: "object"
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Text", name: "text", widget: "text"}
          - label: "CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "text"}
              - {label: "Text", name: "text", widget: "text"}
          - {label: "Footer Line", name: "footerLine", widget: "string"}

  - name: "pages"
    label: "Inner Pages"
    files:
      - file: "content/services.json"
        label: "Services Page"
        name: "services"
        format: "json"
        fields:
          - {label: "Meta Title", name: "metaTitle", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - label: "Cards"
            name: "cards"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
      - file: "content/projects.json"
        label: "Projects Page"
        name: "projects"
        format: "json"
        fields:
          - {label: "Meta Title", name: "metaTitle", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Image", name: "image", widget: "image"}
      - file: "content/areas.json"
        label: "Areas Page"
        name: "areas"
        format: "json"
        fields:
          - {label: "Meta Title", name: "metaTitle", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - label: "Cards"
            name: "cards"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
      - file: "content/contact.json"
        label: "Contact Page"
        name: "contact"
        format: "json"
        fields:
          - {label: "Meta Title", name: "metaTitle", widget: "string"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
          - {label: "Hero Image", name: "heroImage", widget: "image"}
          - {label: "Notice", name: "notice", widget: "text"}
