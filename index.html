<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROK Group</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background: white;
}

.logo {
  font-weight: bold;
  font-size: 24px;
}

.hero {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  margin: 40px;
}

.hero img {
  width: 100%;
  height: 500px;
  object-fit: cover;
}

.hero-content {
  position: absolute;
  top: 50%;
  left: 40px;
  transform: translateY(-50%);
  color: white;
  max-width: 500px;
}

.hero h1 {
  font-size: 42px;
  margin-bottom: 20px;
}

.hero p {
  margin-bottom: 20px;
}

.buttons a {
  display: inline-block;
  padding: 12px 20px;
  margin-right: 10px;
  border-radius: 8px;
  text-decoration: none;
}

.btn-primary {
  background: #1e2f4f;
  color: white;
}

.btn-secondary {
  background: white;
  color: black;
}
</style>
</head>

<body>

<header>
  <div class="logo">ROK</div>
</header>

<section class="hero">
  <img id="hero-image" src="" alt="">
  <div class="hero-content">
    <h1 id="hero-title"></h1>
    <p id="hero-subtitle"></p>

    <div class="buttons">
      <a id="btn-primary" class="btn-primary"></a>
      <a id="btn-secondary" class="btn-secondary"></a>
    </div>
  </div>
</section>

<script>
fetch('/content/homepage.json')
  .then(res => res.json())
  .then(data => {
    document.getElementById('hero-title').innerText = data.hero_title;
    document.getElementById('hero-subtitle').innerText = data.hero_subtitle;
    document.getElementById('btn-primary').innerText = data.button_primary;
    document.getElementById('btn-secondary').innerText = data.button_secondary;
    document.getElementById('hero-image').src = data.hero_image;
  });
</script>

</body>
</html>
